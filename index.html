<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yarin AI</title>
<style>
:root{--bg:#04050b;--metal:#10131d;--metal2:#1b1f31;--cy:#6fe3ff;--vi:#9a7bff;--pk:#ff6fd8;--t:#eef2ff;--m:#8e97bd;--g:rgba(255,255,255,.055);--b:rgba(111,227,255,.22);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 20% 0,#1a1550 0,transparent 55%),radial-gradient(ellipse at 90% 100%,#06324a 0,transparent 55%),var(--bg);color:var(--t);font-family:system-ui,"Segoe UI",Arial,sans-serif;padding:10px;overflow:hidden}
#app{height:100%;display:flex;border-radius:34px;background:linear-gradient(160deg,var(--metal2),var(--metal) 40%,#0a0c14);border:1px solid rgba(111,227,255,.4);box-shadow:0 0 0 5px #0b0d16,0 0 0 6px rgba(154,123,255,.35),0 0 60px rgba(111,227,255,.18),inset 0 0 50px rgba(154,123,255,.12);overflow:hidden;position:relative}
#app:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(111,227,255,.025) 3px 4px)}
#chat{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{display:flex;align-items:center;gap:10px;padding:12px 18px}
.mini{width:42px;height:42px}
.logo{font-weight:800;font-size:21px;letter-spacing:.5px;background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk),#ffd36f,var(--cy));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite}
@keyframes sh{to{background-position:300% 0}}
.sp{flex:1}
.hb{background:var(--g);border:1px solid var(--b);color:var(--t);border-radius:12px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.hb:hover,.hb.on{border-color:var(--cy);box-shadow:0 0 16px rgba(111,227,255,.35);color:var(--cy)}
#log{flex:1;overflow-y:auto;padding:6px 18px 14px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.m{max-width:min(760px,92%);padding:12px 16px;border-radius:20px;line-height:1.75;word-break:break-word;animation:in .45s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.95)}}
.u{align-self:flex-start;background:linear-gradient(135deg,#5a47e6,#2f8fe0);box-shadow:0 6px 28px rgba(100,90,255,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.a{align-self:flex-end;background:var(--g);border:1px solid var(--b);backdrop-filter:blur(12px);box-shadow:inset 0 0 24px rgba(111,227,255,.05)}
.hero{margin:auto;text-align:center;animation:in .9s both;padding:10px}
.stage{position:relative;width:250px;height:300px;margin:0 auto 6px}
.orb{position:absolute;top:0;left:25px;width:200px;height:200px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px #0c0e18,0 0 0 6px var(--cy),0 0 40px var(--cy),0 0 100px rgba(154,123,255,.55);animation:fl 5s ease-in-out infinite}
.orb canvas{width:100%;height:100%;display:block}
.orb:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.55),transparent 28%),linear-gradient(115deg,transparent 40%,rgba(255,255,255,.1) 50%,transparent 60%)}
@keyframes fl{50%{transform:translateY(-12px)}}
.ring{position:absolute;left:50%;border:2px solid var(--cy);border-radius:50%;transform:translateX(-50%) rotateX(72deg);box-shadow:0 0 18px var(--cy),inset 0 0 18px rgba(111,227,255,.5);animation:rp 3s ease-in-out infinite}
.r1{top:225px;width:240px;height:240px}.r2{top:240px;width:170px;height:170px;animation-delay:-.8s;border-color:var(--vi);box-shadow:0 0 18px var(--vi),inset 0 0 18px rgba(154,123,255,.5)}.r3{top:255px;width:100px;height:100px;animation-delay:-1.6s;border-color:var(--pk)}
@keyframes rp{50%{opacity:.35;transform:translateX(-50%) rotateX(72deg) scale(1.08)}}
.hero h2{margin:0 0 6px;font-size:28px;background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--m);margin:0 0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:580px;margin:auto}
.chips button{background:var(--g);border:1px solid var(--b);color:var(--t);border-radius:99px;padding:8px 15px;font:inherit;font-size:13px;cursor:pointer;transition:.25s}
.chips button:hover{transform:translateY(-3px);border-color:var(--cy);box-shadow:0 8px 22px rgba(111,227,255,.3)}
pre{direction:ltr;text-align:left;background:#070914;border:1px solid var(--b);border-radius:12px;padding:12px;overflow-x:auto;font-size:12.5px;margin:8px 0;white-space:pre}
.bar{display:flex;gap:8px;margin:6px 0;align-items:center}
.bar button{background:var(--g);border:1px solid var(--b);color:var(--t);border-radius:9px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.bar button:hover{border-color:var(--cy)}
.dots span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy);animation:bn 1s infinite}
.dots span:nth-child(2){animation-delay:.15s;background:var(--vi)}.dots span:nth-child(3){animation-delay:.3s;background:var(--pk)}
@keyframes bn{50%{transform:translateY(-7px);opacity:.4}}
form{display:flex;gap:12px;padding:10px 18px 18px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:160px;background:rgba(255,255,255,.05);border:1px solid var(--b);color:var(--t);border-radius:18px;padding:14px 18px;font:inherit;transition:.25s;box-shadow:inset 0 0 20px rgba(0,0,0,.4)}
textarea:focus{outline:0;border-color:var(--cy);box-shadow:0 0 0 3px rgba(111,227,255,.18),0 0 24px rgba(111,227,255,.2)}
#send{width:54px;height:54px;border:0;cursor:pointer;color:#fff;font-size:20px;clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%);background:linear-gradient(135deg,var(--cy),var(--vi) 60%,var(--pk));transition:.25s;filter:drop-shadow(0 0 10px var(--cy))}
#send:hover{transform:scale(1.12) rotate(-15deg)}#send:disabled{opacity:.45}
.pv{display:none;width:48%;flex-direction:column;border-right:1px solid var(--b);background:rgba(6,8,16,.88);backdrop-filter:blur(20px);animation:in .4s both;position:relative}
.pv.on{display:flex}.pv .bar{padding:12px}
.pv iframe{flex:1;border:0;background:#fff;margin:0 12px 12px;border-radius:14px;box-shadow:0 0 30px rgba(111,227,255,.2)}
.pv textarea{flex:1;margin:0 12px 12px;direction:ltr;font-family:monospace;font-size:12px;border-radius:14px}
@media (max-width:820px){.pv{position:fixed;inset:10px;width:auto;z-index:5;border-radius:30px;border:1px solid var(--cy)}#app{border-radius:26px}.stage{transform:scale(.85);margin-top:-20px}}
</style></head><body>
<div id="app">
<section id="chat">
<header><canvas class="mini" id="mc" width="84" height="84" style="border-radius:50%;box-shadow:0 0 0 2px var(--cy),0 0 18px var(--cy)"></canvas><span class="logo">Yarin AI</span><span class="sp"></span>
<button class="hb" id="pw" title="מודל חזק יותר, איטי יותר">🧠 חזק</button><button class="hb" id="new">שיחה חדשה</button></header>
<div id="log"></div>
<form id="f"><textarea id="q" rows="1" placeholder="תבקש כל דבר..."></textarea><button id="send" title="שלח">➤</button></form>
</section>
<aside class="pv" id="pv"><div class="bar"><button id="tp">תצוגה</button><button id="tc">קוד</button><button id="cp">העתק</button><button id="dl">הורד</button><span class="sp"></span><button id="cl">✕</button></div><iframe id="fr" sandbox="allow-scripts allow-forms allow-modals"></iframe><textarea id="code" readonly></textarea></aside>
</div>
<script>
const $=i=>document.getElementById(i);
const SYS="אתה Yarin AI, עוזר חכם, גמיש ויצירתי שמבוסס על Claude. עשה מה שהמשתמש מבקש במיטב יכולתך וענה בשפה שבה הוא כותב. כשמבקשים אתר, דף, משחק או כלי: החזר קובץ HTML אחד שלם ועצמאי בתוך בלוק ```html, עם CSS ו-JS בפנים, בלי ספריות או תמונות חיצוניות (Google Fonts מותר), בעיצוב מרשים וייחודי, אנימציות חלקות, רספונסיבי. בבקשות שינוי החזר את הקובץ המלא המעודכן. אחרי הקוד כתוב משפט קצר אחד בלבד.";
const IDEAS=["תבנה לי דף נחיתה עתידני עם אנימציות","משחק נחש בדפדפן בעיצוב ניאון","תסביר לי חורים שחורים בקלות","תכתוב סיפור קצר על רובוט שמתאהב"];
let H=[],busy=false,strong=false,lastCode="",sample=null,dls=null,ctl=null;
/* galaxy canvases */
const cvs=[];
function galaxy(c){const x=c.getContext("2d"),S=c.width,st=[];for(let i=0;i<700;i++){const r=Math.pow(Math.random(),.7)*S*.5,arm=Math.floor(Math.random()*3)*2.09;st.push({r,a:arm+r*.035+(Math.random()-.5)*.6,h:Math.random()*360,s:Math.random()*1.6+.3})}
cvs.push(()=>{x.fillStyle="rgba(4,5,16,.28)";x.fillRect(0,0,S,S);const t=Date.now()/4000;st.forEach(p=>{const a=p.a+t*(1.2-p.r/S);const px=S/2+Math.cos(a)*p.r,py=S/2+Math.sin(a)*p.r*.8;x.fillStyle="hsl("+(p.h+t*40)%360+",90%,"+(60+p.s*10)+"%)";x.fillRect(px,py,p.s,p.s)});
const g=x.createRadialGradient(S/2,S/2,0,S/2,S/2,S*.14);g.addColorStop(0,"rgba(255,255,255,.9)");g.addColorStop(1,"transparent");x.fillStyle=g;x.fillRect(0,0,S,S)})}
galaxy($("mc"));(function lp(){cvs.forEach(f=>f());requestAnimationFrame(lp)})();
function hero(){cvs.length=1;const l=$("log");l.innerHTML='<div class="hero"><div class="stage"><div class="orb"><canvas id="hc" width="400" height="400"></canvas></div><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div></div><h2>היי, אני Yarin AI</h2><p>תבקש ממני כל דבר ואני עושה</p><div class="chips"></div></div>';
galaxy($("hc"));IDEAS.forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{$("q").value=t;send()};l.querySelector(".chips").append(b)})}
function render(el,text,done){el.textContent="";const parts=text.split("```");
parts.forEach((p,i)=>{if(i%2===0){if(p.trim()){const s=document.createElement("div");s.style.whiteSpace="pre-wrap";s.dir="auto";s.textContent=p.replace(/^\n+|\n+$/g,"");el.append(s)}return}
const nl=p.indexOf("\n"),lang=nl<0?p:p.slice(0,nl).trim(),body=nl<0?"":p.slice(nl+1).replace(/\n$/,"");
const pre=document.createElement("pre");pre.textContent=body;
if(lang==="html"){pre.style.maxHeight="110px";pre.style.overflow="hidden";const bar=document.createElement("div");bar.className="bar";const b=document.createElement("button");b.textContent="פתח תצוגה";b.onclick=()=>openPv(body);bar.append(b);el.append(pre,bar);if(done&&i>=parts.length-2)openPv(body)}else el.append(pre)})}
function openPv(code){lastCode=code;$("fr").srcdoc=code;$("code").value=code;$("pv").classList.add("on");tab(0)}
function tab(c){$("fr").style.display=c?"none":"block";$("code").style.display=c?"block":"none"}
$("tp").onclick=()=>tab(0);$("tc").onclick=()=>tab(1);$("cl").onclick=()=>$("pv").classList.remove("on");
$("cp").onclick=()=>{try{navigator.clipboard.writeText(lastCode)}catch(e){$("code").select();document.execCommand("copy")}$("cp").textContent="הועתק ✓";setTimeout(()=>$("cp").textContent="העתק",1200)};
$("dl").onclick=async()=>{try{dls=dls||await claude.use("downloads");if(dls)await dls.save({filename:"site.html",data:lastCode})}catch(e){}};
$("pw").onclick=()=>{strong=!strong;$("pw").classList.toggle("on",strong)};
$("new").onclick=()=>{if(ctl)ctl.abort();H=[];hero();$("pv").classList.remove("on")};
$("q").oninput=e=>{e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px"};
$("q").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send()}};
$("f").onsubmit=e=>{e.preventDefault();send()};
function msg(cls,t){const d=document.createElement("div");d.className="m "+cls;d.textContent=t;d.dir="auto";$("log").append(d);$("log").scrollTop=1e9;return d}
async function send(){const v=$("q").value.trim();if(!v||busy)return;
if(!H.length){$("log").innerHTML="";cvs.length=1}
H.push({role:"user",content:v});msg("u",v);$("q").value="";$("q").style.height="auto";
const el=msg("a","");el.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
busy=true;$("send").disabled=true;ctl=new AbortController();
try{sample=sample||await claude.use("sample");if(!sample)throw{code:"none"};
const msgs=H.map(x=>({role:x.role,content:x.content}));msgs[0]={role:"user",content:"הנחיות מערכת: "+SYS+"\n\n---\n"+msgs[0].content};
const r=await sample(msgs,{cache:false,signal:ctl.signal,modelTier:strong?"complex":"default",onText:({text})=>{render(el,text,false);$("log").scrollTop=1e9}});
render(el,r.text,true);H.push({role:"assistant",content:r.text})}
catch(e){if(e&&e.name==="AbortError")return;el.textContent=e&&(e.code==="none"||e.code==="not_granted")?"צריך לאשר הרשאה כדי שאוכל לענות. שלח שוב ואשר.":e&&e.code==="rate_limited"?"הגעת למגבלת קצב, נסה שוב בעוד רגע.":"משהו השתבש, נסה שוב.";H.pop()}
busy=false;$("send").disabled=false}
hero();
</script></body></html>
